name: Build & Publish LyricNow Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine release tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Sync app version & Windows PE metadata with release tag
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          if ($tag) {
            Set-Content -Path "modules/version.py" -Value "APP_VERSION = `"$tag`"" -Encoding UTF8
            $nums = ($tag -replace '^v', '') -split '\.'
            $v1 = if ($nums.Count -ge 1) { [int]$nums[0] } else { 1 }
            $v2 = if ($nums.Count -ge 2) { [int]$nums[1] } else { 0 }
            $v3 = if ($nums.Count -ge 3) { [int]$nums[2] } else { 0 }
            $verTuple = "($v1, $v2, $v3, 0)"
            $verDot = "$v1.$v2.$v3.0"
            if (Test-Path "version_info.txt") {
              $vi = Get-Content "version_info.txt" -Raw -Encoding UTF8
              $vi = $vi -replace 'filevers=\([^\)]+\)', "filevers=$verTuple"
              $vi = $vi -replace 'prodvers=\([^\)]+\)', "prodvers=$verTuple"
              $vi = $vi -replace "StringStruct\('FileVersion', '[^']+'\)", "StringStruct('FileVersion', '$verDot')"
              $vi = $vi -replace "StringStruct\('ProductVersion', '[^']+'\)", "StringStruct('ProductVersion', '$verDot')"
              Set-Content -Path "version_info.txt" -Value $vi -Encoding UTF8
            }
            if (Test-Path "LyricNow.manifest") {
              $mf = Get-Content "LyricNow.manifest" -Raw -Encoding UTF8
              $mf = $mf -replace 'version="[0-9\.]+"', "version=`"$verDot`""
              Set-Content -Path "LyricNow.manifest" -Value $mf -Encoding UTF8
            }
          }

      - name: Build LyricNow.exe with PyInstaller
        run: |
          pyinstaller LyricNow.spec --noconfirm

      - name: Verify executable & compute SHA-256 checksum
        shell: pwsh
        run: |
          if (!(Test-Path "dist/LyricNow.exe")) {
            Write-Error "dist/LyricNow.exe was not generated!"
            exit 1
          }
          Get-Item "dist/LyricNow.exe" | Select-Object Name, Length
          $hash = (Get-FileHash "dist/LyricNow.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/SHA256SUMS.txt" -Value "$hash  LyricNow.exe" -Encoding UTF8
          Get-Content "dist/SHA256SUMS.txt"

      - name: Generate release notes for tag
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $updates = ""

          if (Test-Path "CHANGELOG.md") {
            $lines = Get-Content -Path "CHANGELOG.md" -Encoding UTF8
            $capture = $false
            $buf = @()
            foreach ($ln in $lines) {
              if ($ln -match "^##\s+$([regex]::Escape($tag))\b") {
                $capture = $true
                continue
              }
              if ($capture -and $ln -match "^##\s+") {
                break
              }
              if ($capture) {
                $buf += $ln
              }
            }
            $updates = ($buf -join "`n").Trim()
          }

          if (-not $updates) {
            $prevTag = (git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1)
            if ($prevTag) {
              $updates = (git log "$prevTag..HEAD" --pretty=format:"- %s" | Out-String).Trim()
            } else {
              $updates = (git log -n 5 --pretty=format:"- %s" | Out-String).Trim()
            }
          }

          $bodyLines = @(
            "## Có gì mới trong phiên bản $tag",
            "",
            $updates,
            "",
            "---",
            "",
            "## Tải về & Sử dụng ngay (Không cần cài Python / Không cần clone code)",
            "",
            '1. Tải file **`LyricNow.exe`** ở mục **Assets** bên dưới.',
            '2. Nhấp đúp mở **`LyricNow.exe`** để sử dụng ngay trên Windows 10 / Windows 11.',
            '   *(Nếu Windows Defender SmartScreen hiện cảnh báo tệp tải mới từ Internet, chọn **More info** -> **Run anyway**.)*'
          )
          Set-Content -Path "release_body.md" -Value ($bodyLines -join "`n") -Encoding UTF8
          Get-Content -Path "release_body.md"

      - name: Publish GitHub Release with LyricNow.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "LyricNow ${{ steps.meta.outputs.tag }} (Windows)"
          body_path: release_body.md
          files: |
            dist/LyricNow.exe
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
